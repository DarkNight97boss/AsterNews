name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Controllo tipi
        run: npx tsc --noEmit -p .
      - name: Test unitari
        run: npm test
      - name: Build di produzione
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
